[workspace]
members = ["xtask"]

[workspace.package]
edition = "2024"
authors = ["Samuel Parkinson <samuel.parkinson@hey.com>"]
repository = "https://github.com/sjparkinson/noctigon-kr1k"
license = "MIT"

[workspace.lints.rust]
warnings = "deny"
# Only src/avr/hw.rs, src/avr/rt.rs, the #[unsafe(no_mangle)] on main and the
# exported items in examples/ may opt back in.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# includes lintgroups correctness, suspicious, complexity, perf, style:
all = "deny"
# from clippy:pedantic:
uninlined_format_args = "deny"
semicolon_if_nothing_returned = "deny"
manual_let_else = "deny"
unnecessary_wraps = "deny"
manual_assert = "deny"
ref_option = "deny"
elidable_lifetime_names = "deny"
unnested_or_patterns = "deny"
borrow_as_ptr = "deny"
explicit_iter_loop = "deny"
checked_conversions = "deny"
nonminimal_bool = "deny"
unchecked_time_subtraction = "deny"
manual_assert_eq = "deny"
match_same_arms = "deny"
match_wildcard_for_single_variants = "deny"
cast_lossless = "deny"
cast_ptr_alignment = "deny"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
ref_as_ptr = "deny"
transmute_ptr_to_ptr = "deny"
decimal_bitwise_operands = "deny"
verbose_bit_mask = "deny"
needless_bitwise_bool = "deny"
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"
inline_always = "deny"
no_mangle_with_rust_abi = "deny"
ignore_without_reason = "deny"
# from clippy:nursery:
redundant_clone = "deny"
missing_const_for_fn = "deny"
use_self = "deny"
derive_partial_eq_without_eq = "deny"
branches_sharing_code = "deny"
needless_pass_by_ref_mut = "deny"
suspicious_operation_groupings = "deny"
as_ptr_cast_mut = "deny"
volatile_composites = "deny"
# from clippy:restriction:
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[package]
name = "kr1k"
description = "Firmware for the Noctigon KR1K torch."
readme = "README.md"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[features]
# The fake ADC and reading helpers in src/testing.rs, for xtask's simulators.
# Never on in the firmware.
testing = []

[[bin]]
name = "kr1k"
test = false
bench = false

# Checks link.x and src/avr/rt.rs with real statics. Never flashed.
[[example]]
name = "link"
test = false
bench = false

# Runs src/avr/hw.rs's guards that the firmware never reaches. Never flashed.
[[example]]
name = "guards"
test = false
bench = false

# Indexes out of bounds, so xtask's tests can check its panic check still sees
# one. Never flashed.
[[example]]
name = "panics"
test = false
bench = false

# Divides a `u16` by ten, so xtask's tests can check a wide multiply still
# fails to link. Never flashed, and never linked.
[[example]]
name = "multiplies"
test = false
bench = false

[lints]
workspace = true

# Panics can't unwind on AVR. Debug info only lands in the ELF, never in the
# hex.
[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
debug = true
# Arithmetic LLVM can't prove fits then links a panic, which `no_panics` in
# xtask/src/layout.rs refuses, so nothing wraps by accident. Truncating casts
# and bits shifted out of the top aren't checked.
overflow-checks = true

[profile.dev]
panic = "abort"
opt-level = "s"
