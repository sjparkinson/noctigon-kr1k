[workspace]
members = ["xtask"]

[workspace.package]
edition = "2024"
authors = ["Samuel Parkinson <samuel.parkinson@hey.com>"]
repository = "https://github.com/sjparkinson/noctigon-kr1k"
license = "MIT"

[workspace.lints.rust]
warnings = "deny"
# Only src/avr/hw.rs, src/avr/rt.rs, the #[unsafe(no_mangle)] on main and the
# exported items in examples/ may opt back in.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# includes lintgroups correctness, suspicious, complexity, perf, style:
all = "deny"
# from clippy:pedantic:
uninlined_format_args = "deny"
semicolon_if_nothing_returned = "deny"
manual_let_else = "deny"
unnecessary_wraps = "deny"
manual_assert = "deny"
ref_option = "deny"
elidable_lifetime_names = "deny"
unnested_or_patterns = "deny"
borrow_as_ptr = "deny"
explicit_iter_loop = "deny"
checked_conversions = "deny"
nonminimal_bool = "deny"
unchecked_time_subtraction = "deny"
manual_assert_eq = "deny"
match_same_arms = "deny"
match_wildcard_for_single_variants = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_ptr_alignment = "deny"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
ref_as_ptr = "deny"
transmute_ptr_to_ptr = "deny"
decimal_bitwise_operands = "deny"
verbose_bit_mask = "deny"
needless_bitwise_bool = "deny"
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"
inline_always = "deny"
no_mangle_with_rust_abi = "deny"
ignore_without_reason = "deny"
overly_complex_bool_expr = "deny"
same_functions_in_if_condition = "deny"
invalid_upcast_comparisons = "deny"
index_refutable_slice = "deny"
enum_glob_use = "deny"
wildcard_imports = "deny"
expl_impl_clone_on_copy = "deny"
ptr_offset_by_literal = "deny"
used_underscore_binding = "deny"
used_underscore_items = "deny"
no_effect_underscore_binding = "deny"
mut_mut = "deny"
match_wild_err_arm = "deny"
should_panic_without_expect = "deny"
str_split_at_newline = "deny"
float_cmp = "deny"
bool_to_int_with_if = "deny"
manual_is_power_of_two = "deny"
manual_ilog2 = "deny"
unreadable_literal = "deny"
large_digit_groups = "deny"
single_match_else = "deny"
redundant_else = "deny"
collapsible_else_if = "deny"
unnecessary_semicolon = "deny"
items_after_statements = "deny"
explicit_into_iter_loop = "deny"
redundant_closure_for_method_calls = "deny"
cloned_instead_of_copied = "deny"
map_unwrap_or = "deny"
range_plus_one = "deny"
range_minus_one = "deny"
duration_suboptimal_units = "deny"
unnecessary_debug_formatting = "deny"
# from clippy:nursery:
redundant_clone = "deny"
missing_const_for_fn = "deny"
use_self = "deny"
derive_partial_eq_without_eq = "deny"
branches_sharing_code = "deny"
needless_pass_by_ref_mut = "deny"
suspicious_operation_groupings = "deny"
as_ptr_cast_mut = "deny"
volatile_composites = "deny"
transmute_undefined_repr = "deny"
uninhabited_references = "deny"
fallible_impl_from = "deny"
debug_assert_with_mut_call = "deny"
literal_string_with_formatting_args = "deny"
path_buf_push_overwrite = "deny"
read_zero_byte_vec = "deny"
collection_is_never_read = "deny"
unused_peekable = "deny"
needless_collect = "deny"
or_fun_call = "deny"
useless_let_if_seq = "deny"
equatable_if_let = "deny"
# from clippy:restriction:
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
mem_forget = "deny"
as_underscore = "deny"
as_pointer_underscore = "deny"
fn_to_numeric_cast_any = "deny"
mixed_read_write_in_expression = "deny"
host_endian_bytes = "deny"
suspicious_xor_used_as_pow = "deny"
unused_result_ok = "deny"
unwrap_in_result = "deny"
iter_over_hash_type = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
float_arithmetic = "deny"

[package]
name = "kr1k"
description = "Firmware for the Noctigon KR1K torch."
readme = "README.md"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[features]
# The fake ADC and reading helpers in src/testing.rs, for xtask's simulators.
# Never on in the firmware.
testing = []

[[bin]]
name = "kr1k"
test = false
bench = false

# Checks link.x and src/avr/rt.rs with real statics. Never flashed.
[[example]]
name = "link"
test = false
bench = false

# Runs src/avr/hw.rs's guards that the firmware never reaches. Never flashed.
[[example]]
name = "guards"
test = false
bench = false

# Indexes out of bounds, so xtask's tests can check its panic check still sees
# one. Never flashed.
[[example]]
name = "panics"
test = false
bench = false

# Divides a `u16` by ten, so xtask's tests can check a wide multiply still
# fails to link. Never flashed, and never linked.
[[example]]
name = "multiplies"
test = false
bench = false

[lints]
workspace = true

# Panics can't unwind on AVR. Debug info only lands in the ELF, never in the
# hex.
[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
debug = true
# Arithmetic LLVM can't prove fits then links a panic, which `no_panics` in
# xtask/src/layout.rs refuses, so nothing wraps by accident. Truncating casts
# and bits shifted out of the top aren't checked.
overflow-checks = true

[profile.dev]
panic = "abort"
opt-level = "s"
